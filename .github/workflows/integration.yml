name: Kerberos integration tests

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  kerberos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Vet integration tests
        run: docker compose -f tests/integration/kerberos/compose.yaml --profile test run --rm test go vet -tags integration ./tests/integration/...

      - name: Run integration tests
        run: docker compose -f tests/integration/kerberos/compose.yaml --profile test run --rm test go test -tags integration -count=1 -v ./tests/integration/...

      - name: Show lab logs
        if: failure()
        run: docker compose -f tests/integration/kerberos/compose.yaml --profile test logs --no-color

      - name: Tear down lab
        if: always()
        run: docker compose -f tests/integration/kerberos/compose.yaml --profile test down -v

  report-nightly-failure:
    needs: kerberos
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Open or update failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Kerberos integration tests failing on main'
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "The nightly Kerberos integration run failed again: $RUN_URL"
          else
            gh issue create --title "$title" --body "The nightly Kerberos integration run failed: $RUN_URL"
          fi
