[kdcdefaults]
  kdc_ports = 88
  kdc_tcp_ports = 88

[realms]
  ALPHA.TEST = {
    database_name = /var/lib/krb5kdc/principal-ALPHA
    key_stash_file = /var/lib/krb5kdc/stash-ALPHA
  }
  HUB.TEST = {
    database_name = /var/lib/krb5kdc/principal-HUB
    key_stash_file = /var/lib/krb5kdc/stash-HUB
  }
  GAMMA.TEST = {
    database_name = /var/lib/krb5kdc/principal-GAMMA
    key_stash_file = /var/lib/krb5kdc/stash-GAMMA
  }
