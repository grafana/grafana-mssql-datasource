[libdefaults]
  default_realm = ALPHA.TEST
  dns_lookup_kdc = false
  dns_lookup_realm = false

[realms]
  ALPHA.TEST = {
    kdc = 127.0.0.1
  }
  HUB.TEST = {
    kdc = 127.0.0.1
  }
  GAMMA.TEST = {
    kdc = 127.0.0.1
  }

[capaths]
  ALPHA.TEST = {
    GAMMA.TEST = HUB.TEST
  }
  GAMMA.TEST = {
    ALPHA.TEST = HUB.TEST
  }
