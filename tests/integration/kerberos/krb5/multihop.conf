  dns_lookup_kdc = false
  dns_lookup_realm = false

[realms]
  ALPHA.TEST = {
    kdc = 10.99.0.50
  }
  HUB.TEST = {
    kdc = 10.99.0.50
  }
  GAMMA.TEST = {
    kdc = 10.99.0.50
  }

[domain_realm]
  svc.gamma.test:1433 = GAMMA.TEST
  .gamma.test = GAMMA.TEST

[capaths]
