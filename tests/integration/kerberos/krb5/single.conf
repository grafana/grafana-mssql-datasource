[libdefaults]
  default_realm = B.TEST
  dns_lookup_realm = false
  dns_lookup_kdc = false
  rdns = false
  forwardable = true
  udp_preference_limit = 1

[realms]
  B.TEST = {
    kdc = 10.99.0.10
    admin_server = 10.99.0.10
    default_domain = b.test
  }
  A.TEST = {
    kdc = 10.99.0.20
    admin_server = 10.99.0.20
    default_domain = a.test
  }

[domain_realm]
  .b.test = B.TEST
  b.test = B.TEST
  .a.test = A.TEST
  a.test = A.TEST
