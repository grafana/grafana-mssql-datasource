services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    environment:
      # Grafana 13 enables splashScreen by default; the overlay blocks Playwright interactions.
      GF_FEATURE_TOGGLES_splashScreen: 'false'
      # Enable localization for plugins.
      GF_FEATURE_TOGGLES_localizationForPlugins: 'true'
    configs:
      # Run the externalized plugin in place of the core MSSQL plugin.
      # Without as_external=true, DuplicatePluginIDValidation (pkg/services/pluginsintegration/pipeline/steps.go)
      # drops the external plugin because the core one is already registered under id=mssql.
      - source: grafana_custom_ini
        target: /etc/grafana/grafana.ini
    depends_on:
      mssql-loader:
        condition: service_completed_successfully

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Password123!"
      MSSQL_PID: "Developer"
    healthcheck:
      test:
        [
          "CMD",
          "/opt/mssql-tools18/bin/sqlcmd",
          "-S", "localhost",
          "-U", "sa",
          "-P", "Password123!",
          "-Q", "SELECT 1",
          "-b",
          "-C",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s

  mssql-loader:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./tests/e2e/fixtures:/data:ro
    entrypoint:
      [
        "/opt/mssql-tools18/bin/sqlcmd",
        "-S", "mssql",
        "-U", "sa",
        "-P", "Password123!",
        "-i", "/data/world_data.sql",
        "-b",
        "-C",
      ]
    restart: "no"

configs:
  grafana_custom_ini:
    content: |
      [plugin.mssql]
      as_external = true
